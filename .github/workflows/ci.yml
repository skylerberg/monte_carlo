name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets

      - name: Test (all features)
        run: cargo test --workspace --all-features

      # The crate is built to run without `time` on wasm, where `Instant`
      # panics, so the default-off path is a supported configuration and not a
      # variant of the above. `mcts-tune` is offline tooling that never reaches
      # wasm, so this one stays on the search crate alone.
      - name: Test (no default features)
        run: cargo test -p mcts --no-default-features

      # Every `debug_assert!` compiles away here, so the release halves of the
      # degenerate-node contracts — which assert on the value a debug build
      # aborts before producing — run in this step and in no other.
      - name: Test (release)
        run: cargo test --workspace --release --all-features

      # The dev profile, deliberately: overflow checks and `debug_assert!` are
      # on here and nowhere else the example runs, and a debug-build panic on
      # its first move is what went unnoticed while nothing executed it.
      - name: Run the example
        run: cargo run --example tic_tac_toe

      # `mcts`'s own features; `-p` because `mcts-tune` does not have them.
      - name: Feature matrix
        run: |
          for f in "" time parallel serde time,parallel time,serde parallel,serde; do
            echo "::group::features=[$f]"
            cargo check -p mcts --no-default-features --features "$f"
            echo "::endgroup::"
          done
