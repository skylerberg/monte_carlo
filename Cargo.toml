[package]
name = "mcts"
version = "0.4.0"
edition = "2021"
description = "A generic, allocation-conscious Monte Carlo Tree Search library with Information Set MCTS and simultaneous-move support."
license = "MIT OR Apache-2.0"

[features]
default = ["time"]
# Wall-clock search budgets. Off for wasm targets, where `Instant` panics.
time = []
# Root-parallel search over std::thread::scope.
parallel = []
serde = ["dep:serde"]

[dependencies]
rand_core = "0.10"
hashbrown = "0.17"
rustc-hash = "2"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
wyrand = "0.4"

[[bench]]
name = "child_storage"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "simultaneous"
harness = false

# Tests run optimized. The suite is dominated by search loops — the sequential
# fingerprint alone runs 405 searches — and at `opt-level = 0` that is minutes
# per run rather than seconds, which is a cost paid on every edit. Debug
# assertions stay on: they are what the `ROOT_CHOICES_INVARIANT` and node-kind
# checks exist for, and running the suite without them would test a different
# crate.
[profile.test]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"
